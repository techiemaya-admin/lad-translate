[project]
name = "lad-translate"
version = "0.1.0"
description = "LAD Live Translation - self-hosted real time multilingual interpretation"
requires-python = ">=3.11"

# Core stays light so the skeleton installs on any machine. Inference backends
# are extras: the CPU set runs on the dev Mac, the GPU set replaces it later
# without any change to the pipeline (see adapters/base.py).
dependencies = [
    "pydantic>=2.9",
    "numpy>=1.26,<2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# --- CPU backends: viable on the 2014 Intel dev Mac -------------------------
stt-cpu = ["faster-whisper>=1.1.0"]
mt-cpu  = ["ctranslate2>=4.4", "sentencepiece>=0.2", "huggingface-hub>=0.26"]
tts-cpu = ["piper-tts>=1.2"]

# --- GPU backends: for the 24GB box, not installable here -------------------
# stt-gpu = ["nemo-toolkit[asr]>=2.0"]
# tts-gpu = ["kokoro>=0.9"]

# --- Transport and storage --------------------------------------------------
livekit = ["livekit-agents~=1.4", "livekit>=1.0"]
db      = ["asyncpg>=0.30"]
api     = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pyjwt>=2.9"]

dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lad_translate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly. Left to its defaults, a ruff upgrade silently changes what
# CI enforces, and a lint gate that moves on its own is a lint gate people
# start ignoring.
[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I", "B", "C4", "SIM", "UP", "RUF", "BLE", "EXE", "PYI"]

ignore = [
    # zip() here is always over sequences of known equal length, and strict=
    # would add noise to every call site for no caught bug.
    "B905",
    # "Ambiguous unicode". The language names and test fixtures ARE Telugu,
    # Arabic and Devanagari; flagging them is the rule being wrong about this
    # project rather than the project being wrong.
    "RUF001", "RUF002", "RUF003",
    # CommitReason inherits (str, Enum) on purpose so its members serialise as
    # plain strings into logs and JSON. StrEnum changes that behaviour.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tools are single-file operator scripts. They must put src on sys.path before
# importing the package, which is by definition an import below the top of the
# file, and a broad catch turns a stack trace into a usable message.
"tools/*" = ["BLE001", "E402"]

# Tests catch broadly to decide whether to skip when Postgres or a model is
# absent, and assert on broad exceptions where the specific type is not the
# point. The unused unpacked names are how the build() helper reads.
"tests/*" = ["BLE001", "B017", "RUF059", "RUF007", "C408"]
