name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv python install 3.11
      - name: Lint
        run: |
          # The ruleset is pinned in pyproject.toml. Left to ruff's defaults it
          # would drift with every upgrade, and a lint gate that moves on its
          # own is one people learn to ignore.
          uvx ruff@0.14.2 check .

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv python install 3.11

      - name: Install
        # Only what the dependency-free tests need. Deliberately NOT the model
        # backends: faster-whisper, ctranslate2 and piper pull ~1GB of wheels,
        # and the tests that use them fetch another 1.8GB of weights. They skip
        # themselves when the models are absent, which is the point.
        run: |
          uv venv
          uv pip install -e '.[dev]' pyjwt fastapi httpx 'uvicorn[standard]'

      - name: Run
        # Chunker, stability, clause detection, drift, backpressure, latency,
        # config, tenancy, tokens, routing table and the pipeline against fakes.
        # 165 tests, no Postgres, no models, no GPU.
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_chunker.py tests/test_stability.py tests/test_clause.py \
            tests/test_drift.py tests/test_config.py tests/test_tenancy.py \
            tests/test_registry.py tests/test_backpressure.py \
            tests/test_tokens.py tests/test_latency.py \
            tests/test_gpu_backends.py tests/test_pipeline.py

  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lad
          POSTGRES_PASSWORD: lad
          POSTGRES_DB: salesmaya_agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv python install 3.11

      - name: Install
        run: |
          uv venv
          uv pip install -e '.[dev]' asyncpg pyjwt fastapi httpx 'uvicorn[standard]'

      - name: Run
        # Tenant isolation is the property worth a real database rather than a
        # mock: these assert that one tenant's store returns nothing for
        # another tenant's session, which only means anything against real SQL.
        env:
          LAD_TEST_DATABASE_URL: postgresql://lad:lad@127.0.0.1:5432/salesmaya_agent
          LAD_DATABASE_URL: postgresql://lad:lad@127.0.0.1:5432/salesmaya_agent
          LAD_CONTROL_SCHEMA: lad_dev
        run: |
          .venv/bin/python -m pytest -q tests/test_db_sessions.py tests/test_join_api.py
