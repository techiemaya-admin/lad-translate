name: Secret scan

# Runs on every push and pull request. This is a gate, not a report: a finding
# fails the build.
#
# Mr LAD has an open incident from credentials committed in a Cloud Build file.
# .gitleaks.toml carries a rule for exactly that shape (a substitution variable
# whose name contains SECRET or KEY holding a literal instead of
# SET_IN_TRIGGER), which only helps if something actually runs it.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned deliberately. Bump by hand, and update the checksum with it.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # Depth 0 on purpose. A secret that was committed and later removed
          # is still compromised, and only a full history scan finds it.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          curl -sSfL -o "$file" "$url"

          # A security gate that runs an unverified download is not a security
          # gate. Fail loudly if the artifact is not the one we pinned.
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -

          tar xzf "$file" gitleaks
          ./gitleaks version

      - name: Scan
        run: |
          set -euo pipefail
          # `detect` scans git history. Do NOT swap this for --no-git: that
          # walks the working tree ignoring .gitignore, and on a developer
          # machine it reports hundreds of false hits from model weights and
          # the Go module cache.
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload findings
        # Only useful when something failed, and the report is what makes a
        # finding triageable rather than just a red tick.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: gitleaks.sarif
          retention-days: 14

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "### Secret scan failed"
            echo
            echo "A value matching a credential pattern is in this repository's history."
            echo
            echo "**If it is a real secret:** treat it as compromised. Rotate it first,"
            echo "then remove it from history. Deleting the line in a new commit is not"
            echo "enough, because the old commit still carries it."
            echo
            echo "**If it is a false positive:** prefer changing the value over"
            echo "allowlisting the file. An allowlist would also hide a real secret that"
            echo "landed there later. The LiveKit \`devkey\`/\`secret\` pair used for local"
            echo "development is published by LiveKit and is not a secret."
            echo
            echo "Download the \`gitleaks-findings\` artifact for the exact locations."
          } >> "$GITHUB_STEP_SUMMARY"
